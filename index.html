<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحور الشخصي | Premium Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #050510;
            --surface: rgba(12, 18, 35, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f0f0ff;
            --muted: #a0a5c0;
            --cyan: #00e5ff;
            --purple: #b44dff;
            --pink: #ff2d95;
            --green: #00e676;
            --radius: 18px;
            --font: 'Cairo', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            direction: rtl;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 560px;
            padding: 30px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .avatar-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--cyan), var(--purple), var(--pink), var(--cyan));
            animation: spin 4s linear infinite;
            filter: blur(10px);
            opacity: 0.8;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .avatar-img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255,255,255,0.2);
            background: #1a1a30;
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #d0e0ff, #e0c8ff, #ffd0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(180,160,255,0.4));
        }

        .profile-bio {
            font-size: 0.9rem;
            color: var(--muted);
            text-align: center;
            max-width: 380px;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(14px);
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.12);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00e676;
            box-shadow: 0 0 14px #00e676;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%,100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .visitor-badge {
            background: rgba(255,255,255,0.03);
            padding: 8px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.85rem;
            backdrop-filter: blur(10px);
        }

        .music-widget {
            width: 100%;
            background: var(--surface);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .music-widget button {
            background: rgba(255,255,255,0.08);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 28px;
            flex: 1;
        }

        .visualizer .bar {
            width: 3px;
            background: var(--cyan);
            border-radius: 3px;
            height: 5px;
            box-shadow: 0 0 10px var(--cyan);
        }

        .visualizer.active .bar {
            animation: bounce 0.6s infinite alternate;
        }

        .visualizer.active .bar:nth-child(1) { animation-delay: 0s; }
        .visualizer.active .bar:nth-child(2) { animation-delay: 0.1s; }
        .visualizer.active .bar:nth-child(3) { animation-delay: 0.2s; }
        .visualizer.active .bar:nth-child(4) { animation-delay: 0.3s; }
        .visualizer.active .bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes bounce {
            0% { height: 5px; }
            100% { height: 28px; }
        }

        .links-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 14px;
        }

        @media(min-width:500px) {
            .links-grid { grid-template-columns: repeat(3,1fr); }
        }

        .link-tile {
            background: var(--surface);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 12px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: 0.35s;
            cursor: pointer;
        }

        .link-tile.wide {
            grid-column: span 2;
            flex-direction: row;
            padding: 20px 16px;
            gap: 14px;
        }

        .link-tile:hover {
            transform: translateY(-4px);
            border-color: var(--cyan);
            box-shadow: 0 14px 36px rgba(0,229,255,0.18);
        }

        .link-tile .icon-box {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .link-tile .title {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .link-tile .desc {
            font-size: 0.72rem;
            color: var(--muted);
        }

        .share-float {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 99;
            background: var(--surface);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0,0,0,0.78);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-box {
            background: rgba(10,16,30,0.9);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 22px;
            padding: 26px;
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            border: none;
            color: #000;
            font-weight: 700;
            padding: 11px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 0.9rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { transform: translateY(-2px);
            opacity: 0.9; }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
        }

        input,select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-family: var(--font);
            margin: 6px 0;
            outline: none;
            font-size: 0.9rem;
        }

        input:focus { border-color: var(--cyan); }

        .admin-panel {
            position: fixed;
            inset: 0;
            z-index: 250;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .admin-panel.active { display: flex; }

        .admin-inner {
            background: rgba(8,14,30,0.93);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 24px;
            padding: 28px 20px;
            width: 100%;
            max-width: 620px;
            margin: 10px 0 40px;
        }

        .admin-section {
            background: rgba(255,255,255,0.025);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .link-row {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .link-row input,.link-row select {
            flex: 1;
            min-width: 70px;
            margin: 0;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            border: 1px solid var(--cyan);
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            z-index: 999;
            animation: toastIn 0.5s, toastOut 0.5s 2.5s forwards;
        }

        @keyframes toastIn {
            from { opacity: 0;
                transform: translateX(-50%) translateY(30px); }
            to { opacity: 1;
                transform: translateX(-50%) translateY(0); }
        }
        @keyframes toastOut {
            to { opacity: 0;
                transform: translateX(-50%) translateY(-20px); }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <main class="main-container">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
            <div class="avatar-wrapper" id="avatarTrigger">
                <div class="avatar-ring"></div>
                <img class="avatar-img" id="profileImg" src="https://i.pravatar.cc/200?img=45" alt="Profile" crossorigin="anonymous">
            </div>
            <h1 class="profile-name" id="profileName">أحمد محمد</h1>
            <p class="profile-bio" id="profileBio">✨ رائد أعمال · مصمم · مبرمج</p>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="statusText">🟢 متصل الآن</span>
            </div>
            <div class="visitor-badge" id="visitorCount">👁️ عدد الزوار: 0</div>
        </div>

        <div class="music-widget" id="musicWidget">
            <button id="playBtn"><i class="fas fa-play"></i></button>
            <div class="visualizer" id="visualizer">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div>
            </div>
            <span style="font-size:0.75rem;">🎵 موسيقى</span>
        </div>
        <audio id="audioPlayer" preload="none"></audio>

        <div class="links-grid" id="linksGrid"></div>
    </main>

    <div class="share-float" id="shareBtn"><i class="fas fa-share-alt"></i></div>

    <div class="modal" id="shareModal">
        <div class="modal-box">
            <h3>🔗 مشاركة</h3>
            <canvas id="qrCanvas" width="170" height="170" style="border-radius:14px;margin:12px auto;display:block;"></canvas>
            <button class="btn" id="copyLinkBtn"><i class="fas fa-copy"></i> نسخ الرابط</button>
            <button class="btn btn-outline" onclick="document.getElementById('shareModal').classList.remove('active')" style="margin-top:8px;">إغلاق</button>
        </div>
    </div>

    <div class="modal" id="loginModal">
        <div class="modal-box">
            <h3>🔐 تسجيل الدخول</h3>
            <p style="color:var(--muted);margin-bottom:10px;">كلمة المرور الافتراضية: <b style="color:#fff;">1234</b></p>
            <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" autocomplete="off">
            <button class="btn" id="loginSubmit">دخول</button>
            <p style="color:#f55;margin-top:8px;display:none;" id="loginError">❌ كلمة المرور غير صحيحة</p>
        </div>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-inner">
            <h2 style="background:linear-gradient(135deg,#d0e0ff,#e0c8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:18px;">⚙️ لوحة التحكم</h2>

            <div class="admin-section">
                <h4>👤 الملف الشخصي</h4>
                <label>الاسم</label>
                <input type="text" id="editName">
                <label>الوصف</label>
                <input type="text" id="editBio">
                <label>رابط الصورة الشخصية</label>
                <input type="url" id="editImage" placeholder="https://...">
                <label>الحالة</label>
                <select id="editStatus">
                    <option value="🟢 متصل الآن">🟢 متصل الآن</option>
                    <option value="🔴 مشغول">🔴 مشغول</option>
                    <option value="📚 يدرس">📚 يدرس</option>
                    <option value="🎮 يلعب">🎮 يلعب</option>
                    <option value="🌙 غير متاح">🌙 غير متاح</option>
                </select>
            </div>

            <div class="admin-section">
                <h4>🎵 الموسيقى</h4>
                <input type="url" id="editAudio" placeholder="رابط MP3 (اتركه فارغاً)">
            </div>

            <div class="admin-section">
                <h4>👁️ عداد الزوار</h4>
                <label>عدد الزوار الحالي</label>
                <input type="number" id="editVisitorCount" min="0" placeholder="أدخل العدد">
                <button class="btn btn-outline" id="resetVisitorBtn" style="margin-top:6px;">🔄 تصفير العداد</button>
            </div>

            <div class="admin-section">
                <h4>🔗 الروابط</h4>
                <div id="linksEditor"></div>
                <button class="btn btn-outline" id="addLinkBtn">➕ إضافة رابط</button>
            </div>

            <div class="admin-section">
                <h4>🔑 تغيير كلمة المرور</h4>
                <input type="password" id="editPassword" placeholder="كلمة المرور الجديدة (اتركه فارغاً للإبقاء)">
            </div>

            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">
                <button class="btn" id="saveBtn"><i class="fas fa-save"></i> حفظ التغييرات</button>
                <button class="btn btn-outline" id="shareGenerateBtn"><i class="fas fa-link"></i> رابط المشاركة</button>
                <button class="btn btn-outline" id="closeAdminBtn">خروج</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ========== كلمة المرور ==========
            let ADMIN_PASS = localStorage.getItem('hub_admin_password') || '1234';

            const DEFAULT_DATA = {
                name: 'أحمد محمد',
                bio: '✨ رائد أعمال · مصمم · مبرمج',
                image: 'https://i.pravatar.cc/200?img=45',
                status: '🟢 متصل الآن',
                audioUrl: '',
                visitorCount: 0,
                links: [
                    { id: '1', title: 'فيسبوك', desc: 'صفحتي الرسمية', url: 'https://facebook.com', icon: 'fa-facebook',
                        color: '#1877f2', wide: true },
                    { id: '2', title: 'واتساب', desc: 'راسلني', url: 'https://wa.me/123456789', icon: 'fa-whatsapp',
                        color: '#25d366', wide: false },
                    { id: '3', title: 'إنستغرام', desc: 'صوري', url: 'https://instagram.com', icon: 'fa-instagram',
                        color: '#e4405f', wide: false },
                    { id: '4', title: 'تويتر', desc: 'تغريدات', url: 'https://twitter.com', icon: 'fa-x-twitter',
                        color: '#1da1f2', wide: true },
                    { id: '5', title: 'يوتيوب', desc: 'قناتي', url: 'https://youtube.com', icon: 'fa-youtube',
                        color: '#ff0000', wide: false },
                    { id: '6', title: 'لينكد إن', desc: 'مهني', url: 'https://linkedin.com', icon: 'fa-linkedin',
                        color: '#0a66c2', wide: false },
                ]
            };

            let profile = JSON.parse(JSON.stringify(DEFAULT_DATA));
            let isReadOnly = false;
            let editData = null;

            // ========== خلفية ==========
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function createParticles() {
                particles = [];
                for (let i = 0; i < 100; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: Math.random() * 1.8 + 0.5,
                        dx: (Math.random() - 0.5) * 0.4,
                        dy: (Math.random() - 0.5) * 0.4,
                    });
                }
            }

            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.dx;
                    p.y += p.dy;
                    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(200,220,255,0.5)';
                    ctx.fill();
                });
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 110) {
                            ctx.strokeStyle = `rgba(0,229,255,${0.06 * (1 - dist/110)})`;
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(drawParticles);
            }

            window.addEventListener('resize', () => { resizeCanvas();
                createParticles(); });
            resizeCanvas();
            createParticles();
            drawParticles();

            // ========== عرض ==========
            function renderAll() {
                document.getElementById('profileName').textContent = profile.name;
                document.getElementById('profileBio').textContent = profile.bio;
                const img = document.getElementById('profileImg');
                img.src = profile.image || DEFAULT_DATA.image;
                img.onerror = () => { img.src = DEFAULT_DATA.image; };
                document.getElementById('statusText').textContent = profile.status;
                updateVisitorDisplay();
                renderMusic();
                renderLinks();
            }

            function updateVisitorDisplay() {
                // تلقائي: زيادة العداد مرة واحدة يومياً
                const today = new Date().toDateString();
                const lastVisit = localStorage.getItem('hub_last_visit');
                if (lastVisit !== today) {
                    profile.visitorCount = (parseInt(profile.visitorCount) || 0) + 1;
                    localStorage.setItem('hub_last_visit', today);
                    // حفظ مباشر
                    localStorage.setItem('hub_profile', JSON.stringify(profile));
                }
                document.getElementById('visitorCount').textContent = `👁️ عدد الزوار: ${profile.visitorCount || 0}`;
            }

            function renderMusic() {
                const w = document.getElementById('musicWidget');
                const a = document.getElementById('audioPlayer');
                if (profile.audioUrl && profile.audioUrl.trim()) {
                    w.style.display = 'flex';
                    a.src = profile.audioUrl;
                } else {
                    w.style.display = 'none';
                    a.pause();
                }
            }

            function renderLinks() {
                const grid = document.getElementById('linksGrid');
                grid.innerHTML = '';
                profile.links.forEach(l => {
                    const tile = document.createElement('a');
                    tile.className = 'link-tile' + (l.wide ? ' wide' : '');
                    tile.href = l.url;
                    tile.target = '_blank';
                    tile.rel = 'noopener';
                    tile.innerHTML = `
                        <div class="icon-box" style="color:${l.color};box-shadow:0 0 16px ${l.color}55;">
                            <i class="fa-brands ${l.icon}"></i>
                        </div>
                        <div style="display:flex;flex-direction:column;align-items:${l.wide?'flex-start':'center'};">
                            <span class="title">${l.title}</span>
                            <span class="desc">${l.desc||''}</span>
                        </div>`;
                    grid.appendChild(tile);
                });
            }

            // ========== QR ==========
            function drawQR(text, canvas) {
                const c = canvas.getContext('2d');
                c.fillStyle = '#fff';
                c.fillRect(0, 0, 170, 170);
                c.fillStyle = '#000';
                const s = 10,
                    o = 20;
                for (let i = 0; i < 13; i++)
                    for (let j = 0; j < 13; j++)
                        if ((i * j + i + j) % 3 === 0) c.fillRect(o + i * s, o + j * s, s - 1, s - 1);
                c.fillRect(22, 22, 26, 26);
                c.fillRect(122, 22, 26, 26);
                c.fillRect(22, 122, 26, 26);
                c.fillStyle = '#fff';
                c.fillRect(28, 28, 16, 16);
                c.fillRect(128, 28, 16, 16);
                c.fillRect(28, 128, 16, 16);
            }

            function shareUrl(data) {
                const j = JSON.stringify(data);
                const e = btoa(unescape(encodeURIComponent(j))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
                return location.origin + location.pathname + '#hub=' + e;
            }

            function decodeShare() {
                const h = location.hash;
                if (!h.startsWith('#hub=')) return null;
                try {
                    let b = h.substring(5).replace(/-/g, '+').replace(/_/g, '/');
                    while (b.length % 4) b += '=';
                    return JSON.parse(decodeURIComponent(escape(atob(b))));
                } catch (e) { return null; }
            }

            // ========== أحداث ==========
            document.getElementById('avatarTrigger').addEventListener('dblclick', () => {
                if (!isReadOnly) document.getElementById('loginModal').classList.add('active');
            });

            document.getElementById('loginSubmit').addEventListener('click', () => {
                const inputPass = document.getElementById('passwordInput').value.trim();
                if (inputPass === ADMIN_PASS) {
                    document.getElementById('loginModal').classList.remove('active');
                    document.getElementById('loginError').style.display = 'none';
                    document.getElementById('passwordInput').value = '';
                    editData = JSON.parse(JSON.stringify(profile));
                    document.getElementById('editName').value = editData.name;
                    document.getElementById('editBio').value = editData.bio;
                    document.getElementById('editImage').value = editData.image;
                    document.getElementById('editStatus').value = editData.status;
                    document.getElementById('editAudio').value = editData.audioUrl || '';
                    document.getElementById('editVisitorCount').value = editData.visitorCount || 0;
                    document.getElementById('editPassword').value = '';
                    renderEditorLinks(editData.links);
                    document.getElementById('adminPanel').classList.add('active');
                } else {
                    document.getElementById('loginError').style.display = 'block';
                    document.getElementById('passwordInput').value = '';
                }
            });

            document.getElementById('passwordInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('loginSubmit').click();
            });

            function renderEditorLinks(links) {
                const c = document.getElementById('linksEditor');
                c.innerHTML = '';
                links.forEach((l) => {
                    const r = document.createElement('div');
                    r.className = 'link-row';
                    r.innerHTML = `
                        <input value="${l.title}" placeholder="عنوان" class="lt" style="flex:2;">
                        <input value="${l.desc||''}" placeholder="وصف" class="ld" style="flex:2;">
                        <input value="${l.url}" placeholder="رابط" class="lu" style="flex:2;">
                        <input value="${l.icon}" placeholder="fa-icon" class="li" style="flex:1.2;">
                        <input type="color" value="${l.color}" class="lc" style="width:42px;height:34px;">
                        <select class="lw"><option value="1" ${l.wide?'selected':''}>عريض</option><option value="0" ${!l.wide?'selected':''}>مربع</option></select>
                        <button class="btn btn-outline" onclick="this.closest('.link-row').remove()" style="padding:6px 10px;">🗑️</button>`;
                    c.appendChild(r);
                });
            }

            document.getElementById('addLinkBtn').addEventListener('click', () => {
                if (!editData) return;
                editData.links.push({ id: 'l' + Date.now(), title: 'رابط جديد', desc: '', url: '#', icon: 'fa-link',
                    color: '#00e5ff', wide: false });
                renderEditorLinks(editData.links);
            });

            document.getElementById('resetVisitorBtn').addEventListener('click', () => {
                document.getElementById('editVisitorCount').value = '0';
                showToast('🔢 تم تصفير العداد');
            });

            document.getElementById('saveBtn').addEventListener('click', () => {
                if (!editData) return;
                editData.name = document.getElementById('editName').value;
                editData.bio = document.getElementById('editBio').value;
                editData.image = document.getElementById('editImage').value;
                editData.status = document.getElementById('editStatus').value;
                editData.audioUrl = document.getElementById('editAudio').value;
                editData.visitorCount = parseInt(document.getElementById('editVisitorCount').value) || 0;
                // جمع الروابط
                const rows = document.querySelectorAll('#linksEditor .link-row');
                editData.links = [];
                rows.forEach(r => {
                    editData.links.push({
                        id: 'l' + Date.now() + Math.random(),
                        title: r.querySelector('.lt').value || 'رابط',
                        desc: r.querySelector('.ld').value || '',
                        url: r.querySelector('.lu').value || '#',
                        icon: r.querySelector('.li').value || 'fa-link',
                        color: r.querySelector('.lc').value || '#00e5ff',
                        wide: r.querySelector('.lw').value === '1',
                    });
                });
                // تغيير كلمة المرور
                const newPass = document.getElementById('editPassword').value.trim();
                if (newPass && newPass.length >= 2) {
                    ADMIN_PASS = newPass;
                    localStorage.setItem('hub_admin_password', newPass);
                    showToast('🔑 تم تغيير كلمة المرور إلى: ' + newPass);
                }
                profile = JSON.parse(JSON.stringify(editData));
                localStorage.setItem('hub_profile', JSON.stringify(profile));
                renderAll();
                document.getElementById('adminPanel').classList.remove('active');
                showToast('✅ تم حفظ جميع التغييرات بنجاح!');
            });

            document.getElementById('shareGenerateBtn').addEventListener('click', () => {
                if (!editData) return;
                // تحديث البيانات من النموذج
                editData.name = document.getElementById('editName').value;
                editData.image = document.getElementById('editImage').value;
                editData.visitorCount = parseInt(document.getElementById('editVisitorCount').value) || 0;
                editData.links = [];
                document.querySelectorAll('#linksEditor .link-row').forEach(r => {
                    editData.links.push({
                        title: r.querySelector('.lt').value,
                        desc: r.querySelector('.ld').value,
                        url: r.querySelector('.lu').value,
                        icon: r.querySelector('.li').value,
                        color: r.querySelector('.lc').value,
                        wide: r.querySelector('.lw').value === '1',
                    });
                });
                const url = shareUrl(editData);
                prompt('🔗 رابط المشاركة الخاص بك:', url);
            });

            document.getElementById('closeAdminBtn').addEventListener('click', () => {
                document.getElementById('adminPanel').classList.remove('active');
            });

            document.getElementById('shareBtn').addEventListener('click', () => {
                const url = shareUrl(profile);
                drawQR(url, document.getElementById('qrCanvas'));
                document.getElementById('shareModal').classList.add('active');
                window._surl = url;
            });

            document.getElementById('copyLinkBtn').addEventListener('click', () => {
                if (window._surl) {
                    navigator.clipboard.writeText(window._surl).then(() => showToast('✅ تم نسخ الرابط بنجاح!'));
                }
            });

            document.getElementById('playBtn').addEventListener('click', () => {
                const a = document.getElementById('audioPlayer');
                const v = document.getElementById('visualizer');
                if (a.paused) {
                    a.play();
                    v.classList.add('active');
                    document.getElementById('playBtn').innerHTML = '<i class="fas fa-pause"></i>';
                } else {
                    a.pause();
                    v.classList.remove('active');
                    document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
                }
            });

            document.getElementById('audioPlayer').addEventListener('pause', () => {
                document.getElementById('visualizer').classList.remove('active');
                document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
            });
            document.getElementById('audioPlayer').addEventListener('play', () => {
                document.getElementById('visualizer').classList.add('active');
                document.getElementById('playBtn').innerHTML = '<i class="fas fa-pause"></i>';
            });

            document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => {
                if (e.target === m) m.classList.remove('active');
            }));

            function showToast(msg) {
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }

            // ========== بدء التشغيل ==========
            const shared = decodeShare();
            if (shared) {
                profile = shared;
                isReadOnly = true;
                document.getElementById('shareBtn').style.display = 'none';
            } else {
                const saved = localStorage.getItem('hub_profile');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.name) profile = parsed;
                    } catch (e) {}
                }
            }
            renderAll();

            // عرض كلمة المرور في الكونسول
            console.log('🔑 كلمة المرور الحالية: ' + ADMIN_PASS);
            console.log('💡 للدخول للوحة التحكم: اضغط مرتين على الصورة الشخصية');
        })();
    </script>
</body>
  </html>
